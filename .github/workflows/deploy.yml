name: Deploy site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- static site ----------------------------------------------------
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          # Stop Jekyll from swallowing files and dirs that begin with an underscore
          # (Flutter emits several). Harmless for the static pages.
          touch _site/.nojekyll

      # ---- Flutter demos ----------------------------------------------------
      # Each demo is a production app with its backend swapped for an
      # in-memory one. Pairs of <folder>:<path on the site>; a folder that
      # doesn't exist is skipped.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned rather than read from pubspec: matches the apps' .fvmrc.
          flutter-version: 3.44.5
          channel: stable
          cache: true

      - name: Test and build demos
        run: |
          set -e
          for pair in demo_app:/demo/ demo_legal:/demos/legal-tasks/ demo_ticketing:/demos/ticketing/; do
            dir="${pair%%:*}"
            href="${pair#*:}"
            if [ ! -f "$dir/pubspec.yaml" ]; then
              echo "::notice::$dir not present - skipped."
              continue
            fi
            echo "::group::$dir -> $href"
            (
              cd "$dir"
              flutter pub get
              # The HR demo predates these flow tests; the newer two carry them.
              if [ "$dir" != "demo_app" ] && [ -d test ]; then flutter test; fi
              # The new demos load the web engine from their own folder, so
              # the page makes no request to any other origin.
              cdn_flag=""
              if [ "$dir" != "demo_app" ]; then cdn_flag="--no-web-resources-cdn"; fi
              flutter build web --release --base-href "$href" $cdn_flag
            )
            mkdir -p "_site$href"
            cp -r "$dir/build/web/." "_site$href"
            echo "::endgroup::"
          done

      # ---- NDA / leakage gate ---------------------------------------------
      # Fails the deploy rather than publishing anything client-identifying.
      #
      # The deny-list lives in the NDA_DENYLIST repository secret, not in this
      # file: this repo is public, so writing the client's name here would leak
      # exactly what the gate exists to catch. Set it to a comma-separated list
      # of terms. If the secret is unset the gate still runs, using the terms
      # that are safe to name in the open.
      - name: NDA gate
        env:
          DENYLIST: ${{ secrets.NDA_DENYLIST }}
        run: |
          set +e
          TERMS="${DENYLIST:-}"
          if [ -z "$TERMS" ]; then
            echo "::warning::NDA_DENYLIST secret is not set - running with default terms only."
            TERMS="supabase"
          fi
          FOUND=0
          IFS=','
          for term in $TERMS; do
            term=$(echo "$term" | tr -d '[:space:]')
            [ -z "$term" ] && continue
            hits=$(grep -ril -- "$term" _site/ 2>/dev/null)
            if [ -n "$hits" ]; then
              echo "::error::NDA gate: a denied term appears in the build output:"
              echo "$hits" | head -20
              FOUND=1
            fi
          done
          unset IFS
          for demo in _site/demo _site/demos; do
            [ -d "$demo" ] || continue
            hits=$(grep -ril -- "supabase" "$demo/" 2>/dev/null)
            if [ -n "$hits" ]; then
              echo "::error::NDA gate: a demo references a backend - it must make no network calls:"
              echo "$hits" | head -20
              FOUND=1
            fi
          done
          if [ "$FOUND" -ne 0 ]; then
            echo "Deployment blocked."
            exit 1
          fi
          echo "NDA gate passed."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
